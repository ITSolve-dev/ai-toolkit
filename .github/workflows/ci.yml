name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check generated OpenCode packages
        run: node scripts/generate-opencode-packages.mjs --check

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check portable manifests and marketplace entries
        run: |
          for dir in plugins/*/; do
            path="./${dir%/}"
            name=$(basename "$dir")
            version=$(jq -er --arg name "$name" '
              select(.name == $name and .["$schema"] == "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json")
              | .version | strings | select(length > 0)
            ' "$dir/plugin.json")
            jq -e --arg name "$name" --arg path "$path" --arg version "$version" '
              [.plugins[] | select(.name == $name)] | length == 1 and
              (.[0] | .source == $path and .version == $version)
            ' .claude-plugin/marketplace.json
            jq -e --arg name "$name" --arg path "$path" '
              [.plugins[] | select(.name == $name)] | length == 1 and
              (.[0].source | .source == "local" and .path == $path)
            ' .agents/plugins/marketplace.json
          done

      - name: Validate marketplace + plugins
        run: |
          claude plugin validate . --strict
          for dir in plugins/*/; do
            claude plugin validate "$dir" --strict
          done

  wiki-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0

      # A bundled wiki ships its generated index.md; rebuild it and fail if it drifted.
      - name: Check bundled wiki indexes are current
        run: |
          for schema in plugins/*/knowledge/SCHEMA.md; do
            [ -e "$schema" ] || continue
            uv run --no-project \
              plugins/llm-wiki/skills/wiki-lint/scripts/build_index.py "$(dirname "$schema")"
          done
          if ! git diff --quiet; then
            echo "::error::A bundled wiki index is stale — regenerate and commit it."
            git diff
            exit 1
          fi
