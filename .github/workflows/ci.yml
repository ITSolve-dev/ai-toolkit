name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate marketplace + plugins
        run: |
          claude plugin validate . --strict
          for dir in plugins/*/; do
            claude plugin validate "$dir" --strict
          done

  pragmatic-programmer:
    strategy:
      fail-fast: false
      matrix:
        # The hook's path handling differs by platform, and a Windows defect passes on Linux.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Check pages against the charter
        run: uv run --no-project plugins/pragmatic-programmer/scripts/check_pages.py plugins/pragmatic-programmer/knowledge

      - name: Test the hook, the page checks and the pilot runner
        working-directory: plugins/pragmatic-programmer
        run: uv run --no-project --python 3.13 -m unittest discover -s tests

  wiki-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0

      # A bundled wiki ships its generated index.md; rebuild it and fail if it drifted.
      - name: Check bundled wiki indexes are current
        run: |
          for schema in plugins/*/knowledge/SCHEMA.md; do
            [ -e "$schema" ] || continue
            uv run --no-project \
              plugins/llm-wiki/skills/wiki-lint/scripts/build_index.py "$(dirname "$schema")"
          done
          if ! git diff --quiet; then
            echo "::error::A bundled wiki index is stale — regenerate and commit it."
            git diff
            exit 1
          fi
